<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 874" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A loom with warp threads and woven cloth">
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EFE3"/>
      <stop offset="0.6" stop-color="#EFE7DB"/>
      <stop offset="1" stop-color="#EAE0CE"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2418"/>
      <stop offset="0.5" stop-color="#2B1B12"/>
      <stop offset="1" stop-color="#201209"/>
    </linearGradient>
    <linearGradient id="clothfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1F2B"/>
      <stop offset="0.55" stop-color="#6E1C27"/>
      <stop offset="1" stop-color="#571520"/>
    </linearGradient>
    <pattern id="clothweave" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="12" y2="3" stroke="#FAF6F0" stroke-opacity="0.06" stroke-width="2.2"/>
      <line x1="0" y1="9" x2="12" y2="9" stroke="#2B1B12" stroke-opacity="0.10" stroke-width="2.2"/>
      <line x1="3" y1="0" x2="3" y2="12" stroke="#2B1B12" stroke-opacity="0.06" stroke-width="2.2"/>
      <line x1="9" y1="0" x2="9" y2="12" stroke="#FAF6F0" stroke-opacity="0.04" stroke-width="2.2"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#C99A45" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#C99A45" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#C99A45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="760" height="874" fill="url(#air)"/>
  <rect width="760" height="874" fill="url(#glow)"/>

  <!-- Top beam of the loom -->
  <rect x="26" y="96" width="708" height="46" rx="10" fill="url(#beam)"/>
  <rect x="26" y="104" width="708" height="5" rx="2.5" fill="#C99A45" opacity="0.5"/>
  <!-- Hanging cords -->
  <line x1="86" y1="142" x2="86" y2="196" stroke="#2B1B12" stroke-width="6" opacity="0.75"/>
  <line x1="674" y1="142" x2="674" y2="196" stroke="#2B1B12" stroke-width="6" opacity="0.75"/>
  <!-- Heddle bar -->
  <rect x="60" y="192" width="640" height="18" rx="9" fill="#8A6414" opacity="0.85"/>

  <!-- Warp threads falling to the fell of the cloth -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="210" x2="100" y2="560" stroke="#B85C38" opacity="0.55"/>
    <line x1="140" y1="210" x2="140" y2="560" stroke="#2B1B12" opacity="0.30"/>
    <line x1="180" y1="210" x2="180" y2="560" stroke="#B85C38" opacity="0.45"/>
    <line x1="220" y1="210" x2="220" y2="560" stroke="#2B1B12" opacity="0.26"/>
    <line x1="260" y1="210" x2="260" y2="560" stroke="#7A1F2B" opacity="0.45"/>
    <line x1="300" y1="210" x2="300" y2="560" stroke="#2B1B12" opacity="0.30"/>
    <line x1="340" y1="210" x2="340" y2="560" stroke="#B85C38" opacity="0.5"/>
    <line x1="380" y1="210" x2="380" y2="560" stroke="#C99A45" opacity="0.6"/>
    <line x1="420" y1="210" x2="420" y2="560" stroke="#2B1B12" opacity="0.28"/>
    <line x1="460" y1="210" x2="460" y2="560" stroke="#B85C38" opacity="0.48"/>
    <line x1="500" y1="210" x2="500" y2="560" stroke="#7A1F2B" opacity="0.42"/>
    <line x1="540" y1="210" x2="540" y2="560" stroke="#2B1B12" opacity="0.3"/>
    <line x1="580" y1="210" x2="580" y2="560" stroke="#B85C38" opacity="0.52"/>
    <line x1="620" y1="210" x2="620" y2="560" stroke="#2B1B12" opacity="0.26"/>
    <line x1="660" y1="210" x2="660" y2="560" stroke="#B85C38" opacity="0.55"/>
  </g>

  <!-- The shuttle mid-flight, weft thread trailing -->
  <g transform="translate(380,470) rotate(-4)">
    <path d="M-150,0 C-120,-26 120,-26 150,0 C120,26 -120,26 -150,0 Z" fill="#8A6414"/>
    <path d="M-150,0 C-120,-20 120,-20 150,0" fill="none" stroke="#C99A45" stroke-width="4" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="58" ry="11" fill="#2B1B12" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#C99A45"/>
  </g>
  <path d="M528,462 C620,450 700,478 760,462" fill="none" stroke="#C99A45" stroke-width="3.4" opacity="0.85"/>
  <path d="M232,478 C160,492 60,470 0,486" fill="none" stroke="#C99A45" stroke-width="2.6" opacity="0.5"/>

  <!-- The woven cloth growing from the fell line down -->
  <rect x="0" y="560" width="760" height="314" fill="url(#clothfade)"/>
  <rect x="0" y="560" width="760" height="314" fill="url(#clothweave)"/>
  <!-- Fell line -->
  <rect x="0" y="556" width="760" height="8" fill="#C99A45" opacity="0.9"/>
  <!-- Woven bands -->
  <rect x="0" y="596" width="760" height="14" fill="#C99A45" opacity="0.5"/>
  <rect x="0" y="640" width="760" height="34" fill="#B85C38" opacity="0.45"/>
  <rect x="0" y="700" width="760" height="8" fill="#C99A45" opacity="0.42"/>
  <rect x="0" y="740" width="760" height="52" fill="#2B1B12" opacity="0.22"/>
  <rect x="0" y="826" width="760" height="10" fill="#C99A45" opacity="0.35"/>
  <!-- A row of zari diamonds in the cloth -->
  <g fill="#C99A45" opacity="0.75">
    <rect x="66"  y="759" width="15" height="15" transform="rotate(45 73.5 766.5)"/>
    <rect x="166" y="759" width="15" height="15" transform="rotate(45 173.5 766.5)"/>
    <rect x="266" y="759" width="15" height="15" transform="rotate(45 273.5 766.5)"/>
    <rect x="366" y="759" width="15" height="15" transform="rotate(45 373.5 766.5)"/>
    <rect x="466" y="759" width="15" height="15" transform="rotate(45 473.5 766.5)"/>
    <rect x="566" y="759" width="15" height="15" transform="rotate(45 573.5 766.5)"/>
    <rect x="666" y="759" width="15" height="15" transform="rotate(45 673.5 766.5)"/>
  </g>

  <!-- Loose threads at the selvedge -->
  <g stroke="#B85C38" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M700,214 C716,260 704,300 720,340" opacity="0.5"/>
    <path d="M46,214 C34,266 48,308 36,350" opacity="0.45"/>
  </g>
</svg>
