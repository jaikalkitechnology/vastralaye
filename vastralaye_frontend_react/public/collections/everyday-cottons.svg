<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woven cotton stripes in terracotta and gold">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6F0"/>
      <stop offset="0.55" stop-color="#F2EADC"/>
      <stop offset="1" stop-color="#EBE0CD"/>
    </linearGradient>
    <!-- Cotton weave: fine warp/weft crosshatch. -->
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="3.5" x2="14" y2="3.5" stroke="#2B1B12" stroke-opacity="0.045" stroke-width="2.6"/>
      <line x1="0" y1="10.5" x2="14" y2="10.5" stroke="#2B1B12" stroke-opacity="0.03" stroke-width="2.6"/>
      <line x1="3.5" y1="0" x2="3.5" y2="14" stroke="#2B1B12" stroke-opacity="0.045" stroke-width="2.6"/>
      <line x1="10.5" y1="0" x2="10.5" y2="14" stroke="#2B1B12" stroke-opacity="0.03" stroke-width="2.6"/>
    </pattern>
    <!-- The card lays an espresso scrim over the bottom for its caption; over
         a pale plaid that reads as grey mud. Deepen the lower third into warm
         terracotta so the scrim lands on richness instead. -->
    <linearGradient id="deepen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8A4326" stop-opacity="0.78"/>
      <stop offset="0.22" stop-color="#A0522D" stop-opacity="0.5"/>
      <stop offset="0.48" stop-color="#B85C38" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#B85C38" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skylight" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFDF9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="660" fill="url(#ground)"/>

  <!-- Vertical cotton stripes, a homespun rhythm -->
  <g>
    <rect x="70"  width="46"  height="660" fill="#B85C38" opacity="0.16"/>
    <rect x="150" width="12"  height="660" fill="#B85C38" opacity="0.30"/>
    <rect x="238" width="80"  height="660" fill="#D9A886" opacity="0.22"/>
    <rect x="352" width="20"  height="660" fill="#7A1F2B" opacity="0.14"/>
    <rect x="470" width="120" height="660" fill="#B85C38" opacity="0.12"/>
    <rect x="516" width="28"  height="660" fill="#B85C38" opacity="0.20"/>
    <rect x="648" width="14"  height="660" fill="#7A1F2B" opacity="0.16"/>
    <rect x="712" width="64"  height="660" fill="#D9A886" opacity="0.24"/>
    <rect x="836" width="34"  height="660" fill="#B85C38" opacity="0.18"/>
    <rect x="918" width="10"  height="660" fill="#B85C38" opacity="0.28"/>
  </g>
  <!-- Gold threads -->
  <g stroke="#8A6414" stroke-width="2">
    <line x1="132" y1="0" x2="132" y2="660" opacity="0.35"/>
    <line x1="336" y1="0" x2="336" y2="660" opacity="0.3"/>
    <line x1="611" y1="0" x2="611" y2="660" opacity="0.35"/>
    <line x1="800" y1="0" x2="800" y2="660" opacity="0.3"/>
  </g>

  <!-- Horizontal bands crossing into a soft plaid -->
  <g>
    <rect y="96"  width="960" height="34" fill="#B85C38" opacity="0.10"/>
    <rect y="152" width="960" height="10" fill="#7A1F2B" opacity="0.10"/>
    <rect y="300" width="960" height="58" fill="#D9A886" opacity="0.14"/>
    <rect y="470" width="960" height="16" fill="#B85C38" opacity="0.12"/>
    <rect y="530" width="960" height="42" fill="#B85C38" opacity="0.08"/>
  </g>
  <g stroke="#8A6414" stroke-width="1.6">
    <line x1="0" y1="140" x2="960" y2="140" opacity="0.3"/>
    <line x1="0" y1="372" x2="960" y2="372" opacity="0.28"/>
    <line x1="0" y1="500" x2="960" y2="500" opacity="0.3"/>
  </g>

  <!-- Weave texture over everything -->
  <rect width="960" height="660" fill="url(#weave)"/>

  <!-- Running stitches -->
  <g stroke="#B85C38" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 10">
    <line x1="60"  y1="238" x2="330" y2="238" opacity="0.4"/>
    <line x1="580" y1="410" x2="905" y2="410" opacity="0.38"/>
    <line x1="660" y1="72"  x2="915" y2="72"  opacity="0.35"/>
  </g>

  <!-- Small diamond motif cluster, top right -->
  <g fill="none" stroke="#8A6414" stroke-width="2.2" opacity="0.55">
    <rect x="806" y="150" width="26" height="26" transform="rotate(45 819 163)"/>
    <rect x="848" y="192" width="26" height="26" transform="rotate(45 861 205)"/>
    <rect x="764" y="192" width="26" height="26" transform="rotate(45 777 205)"/>
    <rect x="806" y="234" width="26" height="26" transform="rotate(45 819 247)"/>
  </g>
  <circle cx="819" cy="205" r="5" fill="#8A6414" opacity="0.55"/>

  <!-- Light from the top, warmth underneath the caption -->
  <rect width="960" height="660" fill="url(#skylight)"/>
  <rect width="960" height="660" fill="url(#deepen)"/>
</svg>
