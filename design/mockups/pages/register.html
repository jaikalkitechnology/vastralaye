<div class="auth-wrap">
  <div class="auth-brand">
    <div class="auth-brand-inner">
      <svg class="ornament" viewBox="0 0 130 14" width="130" height="14" style="margin:0 auto"><g fill="none" stroke="#C99A45"><line x1="0" y1="7" x2="50" y2="7"/><line x1="80" y1="7" x2="130" y2="7"/><rect x="60.5" y="2.5" width="9" height="9" transform="rotate(45 65 7)"/></g><circle cx="65" cy="7" r="1.5" fill="#C99A45"/></svg>
      <h2>Join the Vastralaye family</h2>
      <p>Members get early access to new drops, artisan stories and members-only offers.</p>
    </div>
  </div>
  <div class="auth-form">
    <div class="form-card">
      <h1>Create Account</h1>
      <p class="lead">It takes less than a minute.</p>
      <div class="form-row">
        <div class="field"><label>First name</label><input placeholder="Ananya"></div>
        <div class="field"><label>Last name</label><input placeholder="Sharma"></div>
      </div>
      <div class="field"><label>Email address</label><input type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Phone</label><input placeholder="+91"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="Minimum 8 characters"></div>
      <a class="btn btn-block" href="#">Create Account</a>
      <div class="form-foot">Already have an account? <a href="#">Sign in</a></div>
    </div>
  </div>
</div>
